<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiil Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F9FD; --surface:#FFFFFF; --ink:#14213D; --muted:#56637F; --line:#D3DCEB;
  --accent:#1E3FAE; --on-accent:#FFFFFF; --turq:#0E8F89; --tulip:#D8402F; --sun:#E9A722;
  --ok-bg:#E1F4F0; --ok:#0A6560; --bad-bg:#FCE8E4; --bad:#A12A1B; --star-off:#C9D3E6;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1630; --surface:#13224A; --ink:#EAF0FF; --muted:#9DAED6; --line:#28417D;
    --accent:#7D99FF; --on-accent:#0B1630; --turq:#44CBC2; --tulip:#FF7A68; --sun:#F6C253;
    --ok-bg:#0E3A3B; --ok:#7BE6DC; --bad-bg:#4B1F24; --bad:#FFA396; --star-off:#34508F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1630; --surface:#13224A; --ink:#EAF0FF; --muted:#9DAED6; --line:#28417D;
  --accent:#7D99FF; --on-accent:#0B1630; --turq:#44CBC2; --tulip:#FF7A68; --sun:#F6C253;
  --ok-bg:#0E3A3B; --ok:#7BE6DC; --bad-bg:#4B1F24; --bad:#FFA396; --star-off:#34508F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,52px);line-height:1;margin:0 0 8px;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0 0 8px}
.band{display:block;width:100%;height:48px;border-radius:12px;margin-bottom:18px}
.lede{color:var(--muted);margin:0 0 18px;max-width:44ch}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
.foot{margin-top:24px;color:var(--muted);font-size:14px;text-align:center}

/* home */
.rank{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.rank .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank b{font-family:var(--display);font-size:22px}
.rank small{color:var(--muted)}
.meter{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--turq);border-radius:99px}
.modes{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.mode:hover{border-color:var(--accent)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent)}
.mode .t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.mode .d{color:var(--muted);font-size:15px;line-height:1.3}
details.set{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px}
details.set summary{font-weight:700;cursor:pointer}
.lab{font-weight:700;font-size:15px;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip small{opacity:.8;font-weight:400}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px 6px;font-size:15px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:15px;margin-top:6px}
.mast .meter{margin:0}
.mast span:last-child{color:var(--muted);font-size:14px;min-width:36px;text-align:right}

/* quiz */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--turq);border-radius:99px;transition:width .3s}
.pill{flex:none;font-weight:700;font-size:14px;color:var(--muted);min-width:56px;text-align:right}
.pill b{color:var(--turq)}
.ask{color:var(--muted);font-weight:500;margin:0 0 8px}
.card{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:20px 16px;margin-bottom:14px;text-align:center}
.vb{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,42px);line-height:1.05;margin:0}
.en{color:var(--muted);font-size:16px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.tag{border-radius:99px;padding:5px 12px;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:var(--bg)}
.tag.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag.n{background:var(--bad-bg);border-color:var(--tulip);color:var(--bad)}
.tag small{font-weight:400;opacity:.85}
.sent{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,30px);line-height:1.2;margin:0;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 2px}
.formbig{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:0;overflow-wrap:anywhere}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-size:20px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.field input:focus{outline:3px solid var(--turq);outline-offset:1px;border-color:var(--turq)}
.field .btn{width:auto}
.warn{min-height:22px;color:var(--sun);font-weight:700;font-size:15px;margin-top:6px}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.keys button{min-width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:20px}
.hintrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.hint{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:10px;color:var(--muted)}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font-weight:500;font-size:19px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--turq);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--tulip);color:var(--bad)}
.opt:disabled{cursor:default}
.two{display:grid;gap:12px}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px}
.fb p{margin:4px 0 0;color:var(--ink)}
.fb ul{margin:6px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
.fb .btn{margin-top:12px}
.built{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:2px 0 2px;overflow-wrap:anywhere}
.legend{font-size:13px;color:var(--muted)}
.pt-s{color:var(--ink)} .pt-n{color:var(--tulip)} .pt-t{color:var(--accent)} .pt-p{color:var(--turq)}
.legend .pt-s,.legend .pt-n,.legend .pt-t,.legend .pt-p{font-weight:700}

/* results */
.res{text-align:center;padding-top:6px}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;margin:6px 0 2px}
.rev{text-align:left;margin:18px 0}
.rev .row{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.rev .row b{font-family:var(--display);font-size:22px}
.rev .row small{display:block;color:var(--muted);font-size:14px}

/* tables */
.sel{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.tc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.tc h3{font-family:var(--display);font-size:19px;margin:0}
.tc .tn{color:var(--muted);font-size:14px;margin-bottom:6px}
.tc .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:19px}
.tc .r span:first-child{color:var(--muted);font-size:16px}
.tc .r span:last-child{font-family:var(--display);font-weight:800}
.notice{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px}
.notice ul{margin:6px 0 0;padding-left:20px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =====================================================================
   Turkish conjugation engine
   ===================================================================== */
const VOW = "aeıioöuü";
const isV = c => !!c && VOW.indexOf(c) >= 0;
const lastV = s => { for (let i = s.length - 1; i >= 0; i--) if (isV(s[i])) return s[i]; return null; };
const nV = s => Array.from(s).filter(isV).length;
const h2 = v => ("aıou".indexOf(v) >= 0 ? "a" : "e");
const h4 = v => ({ a:"ı", ı:"ı", o:"u", u:"u", e:"i", i:"i", ö:"ü", ü:"ü" })[v];
const VOICELESS = "çfhkpsşt";
const AOR_EXC = ["al","bil","bul","dur","gel","gör","kal","ol","öl","san","var","ver","vur"];
const PERSONS = ["ben","sen","o","biz","siz","onlar"];
const TENSE_KEYS = ["pres","past","fut","aor","evid","nec"];
const TENSES = {
  pres: { tr:"Şimdiki zaman",       short:"Şimdiki",    en:"present continuous", mark:"-(ı/i/u/ü)yor" },
  past: { tr:"Görülen geçmiş",      short:"Geçmiş",     en:"past (-di)",         mark:"-dı/-di/-du/-dü (-tı/-ti/-tu/-tü)" },
  fut:  { tr:"Gelecek zaman",       short:"Gelecek",    en:"future",             mark:"-(y)acak/-(y)ecek" },
  aor:  { tr:"Geniş zaman",         short:"Geniş",      en:"aorist, habitual",   mark:"-r, -ar/-er or -ır/-ir/-ur/-ür" },
  evid: { tr:"Öğrenilen geçmiş",    short:"-miş",       en:"reported past",      mark:"-mış/-miş/-muş/-müş" },
  nec:  { tr:"Gereklilik",          short:"Gereklilik", en:"must, should",       mark:"-malı/-meli" }
};

/* returns { form, parts:[[text,kind]], notes:[...] }  kinds: s stem, n negative, t tense, p person */
function conj(v, tense, p, neg){
  const st = v.stem, notes = [];
  const negm = h2(lastV(st)) === "a" ? "ma" : "me";
  const out = arr => ({ form: arr.filter(a => a[0]).map(a => a[0]).join(""), parts: arr.filter(a => a[0]), notes });
  const ends4 = V => [V + "m", "s" + V + "n", "", V + "z", "s" + V + "n" + V + "z", "l" + h2(V) + "r"];
  let parts;

  if (tense === "pres") {
    const E = ["um","sun","","uz","sunuz","lar"];
    if (neg) {
      const V = h4(lastV(st));
      parts = [[st,"s"], ["m","n"], [V + "yor","t"], [E[p],"p"]];
      notes.push("The negative -" + negm + " comes straight after the stem, and its " + negm[1] + " drops before -yor.");
    } else if (v.alt) {
      parts = [[v.alt,"s"], ["yor","t"], [E[p],"p"]];
      notes.push("de- and ye- become di- and yi- before -yor and -yecek.");
    } else {
      const s = v.soft || st, last = s[s.length - 1];
      if (v.soft) notes.push(st + " becomes " + s + " before a vowel (t softens to d).");
      if (last === "a" || last === "e") {
        const rest = s.slice(0, -1), V = h4(lastV(rest));
        parts = [[rest,"s"], [V + "yor","t"], [E[p],"p"]];
        notes.push("The final “" + last + "” of " + s + " drops before -yor. The vowel before it decides whether you get ı, i, u or ü.");
      } else if (isV(last)) {
        parts = [[s,"s"], ["yor","t"], [E[p],"p"]];
      } else {
        parts = [[s,"s"], [h4(lastV(s)) + "yor","t"], [E[p],"p"]];
      }
    }
    return out(parts);
  }

  if (tense === "past") {
    const base = neg ? st + negm : st;
    const last = base[base.length - 1];
    const dt = isV(last) ? "d" : (VOICELESS.indexOf(last) >= 0 ? "t" : "d");
    const V = h4(lastV(base));
    const suf = dt + V;
    const E = ["m","n","","k","n" + V + "z","l" + h2(V) + "r"];
    parts = [[st,"s"], [neg ? negm : "","n"], [suf,"t"], [E[p],"p"]];
    if (!neg && dt === "t") notes.push("After a hard consonant (ç f h k p s ş t) the d of -di turns into t.");
    return out(parts);
  }

  if (tense === "fut") {
    let sPart, sForSuffix;
    if (neg) { sPart = [[st,"s"], [negm,"n"]]; sForSuffix = st + negm; }
    else {
      const s = v.alt || v.soft || st;
      sPart = [[s,"s"]]; sForSuffix = s;
      if (v.alt) notes.push("de- and ye- become di- and yi- before -yor and -yecek.");
      if (v.soft) notes.push(st + " becomes " + s + " before a vowel (t softens to d).");
    }
    const y = isV(sForSuffix[sForSuffix.length - 1]) ? "y" : "";
    const suffix = y + (h2(lastV(sForSuffix)) === "a" ? "acak" : "ecek");
    const V = suffix.indexOf("a") >= 0 ? "ı" : "i";
    const stemK = suffix.slice(0, -1);
    const T = [stemK + "ğ", suffix, suffix, stemK + "ğ", suffix, suffix];
    const E = [V + "m", "s" + V + "n", "", V + "z", "s" + V + "n" + V + "z", "l" + h2(V) + "r"];
    if (p === 0 || p === 3) notes.push("Before a vowel the k of -" + suffix + " softens to ğ.");
    return out(sPart.concat([[T[p],"t"], [E[p],"p"]]));
  }

  if (tense === "aor") {
    if (neg) {
      const V = h4(negm[1]);
      const E = ["m", "z" + "s" + V + "n", "z", "y" + V + "z", "z" + "s" + V + "n" + V + "z", "z" + "l" + h2(V) + "r"];
      notes.push("Negative aorist: -" + negm + " + -z. The ben and biz forms are special (-" + negm + "m, -" + negm + "y" + V + "z).");
      return out([[st,"s"], [negm,"n"], [E[p],"p"]]);
    }
    const s = v.soft || st, last = s[s.length - 1];
    if (v.soft) notes.push(st + " becomes " + s + " before a vowel (t softens to d).");
    let suf;
    if (isV(last)) { suf = "r"; notes.push("The stem ends in a vowel, so the aorist is just -r."); }
    else if (v.aor === "er") { suf = h2(lastV(s)) + "r"; notes.push(v.inf + " follows etmek, so it takes -er in the aorist."); }
    else if (nV(s) === 1 && AOR_EXC.indexOf(st) < 0) { suf = h2(lastV(s)) + "r"; notes.push("A one-syllable stem usually takes -ar or -er."); }
    else if (nV(s) === 1) { suf = h4(lastV(s)) + "r"; notes.push(st + " is one of the exceptions (al, bil, bul, dur, gel, gör, kal, ol, san, var, ver, vur) that take -ır/-ir/-ur/-ür."); }
    else { suf = h4(lastV(s)) + "r"; notes.push("A longer stem takes -ır, -ir, -ur or -ür."); }
    const V = h4(lastV(s + suf));
    parts = [[s,"s"], [suf,"t"], [ends4(V)[p],"p"]];
    return out(parts);
  }

  if (tense === "evid") {
    const base = neg ? st + negm : st;
    const V = h4(lastV(base));
    parts = [[st,"s"], [neg ? negm : "","n"], ["m" + V + "ş","t"], [ends4(V)[p],"p"]];
    return out(parts);
  }

  /* nec */
  const base = neg ? st + negm : st;
  const vv = h2(lastV(base)), V = h4(vv);
  const E = ["y" + V + "m", "s" + V + "n", "", "y" + V + "z", "s" + V + "n" + V + "z", "l" + h2(V) + "r"];
  parts = [[st,"s"], [neg ? negm : "","n"], ["m" + vv + "l" + V,"t"], [E[p],"p"]];
  return out(parts);
}

/* =====================================================================
   Data: verbs
   ===================================================================== */
function V(inf, en, tier, obj, fl){
  return Object.assign({ inf, en, tier, obj: obj, stem: inf.slice(0, -3) }, fl || {});
}
const VERBS = [
  /* tier 1: core */
  V("gelmek","to come",1,["buraya","eve","okula"]),
  V("gitmek","to go",1,["okula","işe","markete","denize","sinemaya","İzmir'e"],{ soft:"gid" }),
  V("yapmak","to do, to make",1,["kahvaltı","ödev","spor","alışveriş"]),
  V("almak","to take, to buy",1,["ekmek","bilet","süt","çiçek"]),
  V("vermek","to give",1,["cevap","söz","para"]),
  V("görmek","to see",1,["rüya","uzaktan"]),
  V("bakmak","to look",1,["pencereden","saate","fotoğrafa"]),
  V("yemek","to eat",1,["ekmek","elma","peynir","zeytin","tatlı"],{ alt:"yi" }),
  V("içmek","to drink",1,["çay","kahve","su","süt"]),
  V("okumak","to read",1,["kitap","gazete","mektup","dergi"]),
  V("yazmak","to write",1,["mektup","e-posta","not","kart"]),
  V("sevmek","to love, to like",1,["kediyi","denizi","müziği"]),
  V("istemek","to want",1,["çay","su","kahve","bilet"]),
  V("bilmek","to know",1,["Türkçe","İngilizce"]),
  V("olmak","to be, to become",1,["hasta","yorgun","hazır","mutlu"]),
  V("demek","to say",1,["merhaba","günaydın"],{ alt:"di" }),
  V("konuşmak","to speak",1,["Türkçe","İngilizce","yavaş"]),
  V("anlamak","to understand",1,["Türkçe"]),
  V("çalışmak","to work, to study",1,["ofiste","evde","okulda","kütüphanede"]),
  V("uyumak","to sleep",1,["erken","geç","evde"]),
  V("oturmak","to sit",1,["burada","evde","kafede","parkta"]),
  V("kalkmak","to get up",1,["erken","geç"]),
  V("beklemek","to wait",1,["burada","dışarıda","kapıda"]),
  V("aramak","to look for",1,["anahtarı","telefonu","çantayı"]),
  V("bulmak","to find",1,["anahtarı","telefonu","çantayı"]),
  V("açmak","to open, to turn on",1,["kapıyı","pencereyi","televizyonu","ışığı"]),

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function rankInfo(xp){

}
const activeVerbs = () => S.verbs === "core" ? VERBS.filter(v => v.tier === 1) : VERBS;

const formCache = {};
function getForms(v){
  if (formCache[v.inf]) return formCache[v.inf];
  const m = new Map();
  TENSE_KEYS.forEach(t => [false, true].forEach(n => PERSONS.forEach((_, p) => {
    const f = conj(v, t, p, n).form; const a = m.get(f) || []; a.push([t, p, n]); m.set(f, a);
  })));
  formCache[v.inf] = m; return m;
}
function weightedPick(arr, wf){
  const w = arr.map(wf), tot = w.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
function pickItem(used, needObj, needUnique){
  for (let tries = 0; tries < 40; tries++) {
    const tense = S.tenses[rand(S.tenses.length)];
    let pool = activeVerbs(); if (needObj) pool = pool.filter(v => v.obj);
    const v = weightedPick(pool, x => 6 - box(x, tense));
    const p = rand(6), neg = S.neg === "mix" && Math.random() < 0.3;
    const k = v.inf + tense + p + neg;
    if (used.has(v.inf) && tries < 30) continue;
    if (needUnique) {
      const f = conj(v, tense, p, neg).form;
      if (getForms(v).get(f).length > 1) continue;
    }
    used.add(v.inf); used.add(k);
    return { v, tense, p, neg };
  }
  const v = activeVerbs()[0]; return { v, tense: S.tenses[0], p: 0, neg: false };
}
const ALT = { "ı":["i","u"], "i":["ı","ü"], "u":["ü","ı"], "ü":["u","i"], "a":["e"], "e":["a"] };
function harmonyErrors(c){
  const res = [];
  c.parts.forEach((pt, pi) => {
    if (pt[1] === "s") return;
    Array.from(pt[0]).forEach((ch, ci) => {
      (ALT[ch] || []).forEach(alt => {
        const np = pt[0].slice(0, ci) + alt + pt[0].slice(ci + 1);
        res.push(c.parts.map((x, xi) => xi === pi ? np : x[0]).join(""));
      });
    });
  });
  return res;
}
function distractors(it, correct){
  const v = it.v, forms = getForms(v), cand = [];
  shuffle(harmonyErrors(conj(v, it.tense, it.p, it.neg)).filter(f => f !== correct && !forms.has(f))).slice(0, 2).forEach(f => cand.push(f));
  let p2; do { p2 = rand(6); } while (p2 === it.p);
  cand.push(conj(v, it.tense, p2, it.neg).form);
  const ts = (S.tenses.length > 1 ? S.tenses : TENSE_KEYS).filter(t => t !== it.tense);
  cand.push(conj(v, ts[rand(ts.length)], it.p, it.neg).form);
  cand.push(conj(v, it.tense, it.p, !it.neg).form);
  let uniq = Array.from(new Set(cand)).filter(f => f !== correct);
  let guard = 0;
  while (uniq.length < 3 && guard++ < 30) {
    const f = conj(v, TENSE_KEYS[rand(6)], rand(6), Math.random() < 0.5).form;
    if (f !== correct && uniq.indexOf(f) < 0) uniq.push(f);
  }
  return shuffle(uniq).slice(0, 3);
}
function buildSentence(it){
  const list = SUBJ[it.p];
  let subj = list[rand(list.length)];
  let cue = CUES[it.tense][rand(CUES[it.tense].length)], after = false;
  if (it.tense === "aor" && it.neg && Math.random() < 0.55) { cue = CUES_NEVER[rand(2)]; after = true; }
  const objs = it.v.obj, obj = objs.length ? objs[rand(objs.length)] : "";
  const words = after ? [subj, cue[0], obj] : [cue[0], subj, obj];
  return { before: cap(words.filter(Boolean).join(" ")) + " ", after: ".", cue };
}
function buildQ(mode, it){
  if (mode === "vocab") return buildVocab(it);
  const c = conj(it.v, it.tense, it.p, it.neg);
  const q = { mode, kind: mode, it, ans: c.form, parts: c.parts, notes: c.notes, tries: 0, hint: false };
  if (mode === "pick") q.options = shuffle([c.form].concat(distractors(it, c.form)));
  if (mode === "sent") Object.assign(q, buildSentence(it));
  return q;
}
function vocabPool(){
  const out = [];
  if (S.vocab !== "words") activeVerbs().forEach(v => out.push({ tr: v.inf, en: v.en, cat: "verb" }));
  if (S.vocab !== "verbs") WORDS.forEach(w => out.push({ tr: w[0], en: w[1], cat: w[2] }));
  return out;
}
function buildVocab(item){
  const pool = vocabPool();
  if (!item) item = weightedPick(pool, x => 6 - (save.vk[x.tr] || 0));
  const dir = Math.random() < 0.55 ? "tr2en" : "en2tr";
  const typed = dir === "en2tr" && item.tr.length <= 14 && Math.random() < 0.3;
  const same = pool.filter(x => x.cat === item.cat && x.tr !== item.tr && x.en !== item.en);
  let others = shuffle(same).slice(0, 3);
  if (others.length < 3) others = others.concat(shuffle(pool.filter(x => x.tr !== item.tr && x.en !== item.en && others.indexOf(x) < 0)).slice(0, 3 - others.length));
  const q = { mode: "vocab", kind: "vocab", item, dir, typed, tries: 0 };
  q.ans = dir === "tr2en" ? item.en : item.tr;
  q.options = shuffle([item].concat(others)).map(x => dir === "tr2en" ? x.en : x.tr);
  return q;
}
function makeRound(mode){
  const used = new Set(), qs = [];
  for (let i = 0; i < 10; i++) {
    if (mode === "vocab") qs.push(buildVocab());
    else qs.push(buildQ(mode, pickItem(used, mode === "sent", mode === "detect")));
  }
  return qs;
}
function rebuild(q){
  if (q.mode === "vocab") return buildVocab(q.item);
  return buildQ(q.mode, q.it);
}

    persist(); window.__setOpen = true; home();
  });
  const seg = (id, key) => app.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => { S[key] = b.dataset.v; persist(); window.__setOpen = true; home(); });
  seg("negseg", "neg"); seg("verbseg", "verbs"); seg("vocseg", "vocab");
}

/* =====================================================================
   Quiz
   ===================================================================== */
function startRound(mode){
  Q = { mode, qs: makeRound(mode), i: 0, right: 0, first: 0, xp: 0, streak: 0, best: 0, missed: [], state: null, requeued: 0 };
  renderQ();
}
function tagsHTML(it){
  return '<div class="tags"><span class="tag">' + PERSONS[it.p] + '</span><span class="tag p">' + TENSES[it.tense].short + ' <small>' + TENSES[it.tense].en + '</small></span>' +
    (it.neg ? '<span class="tag n">olumsuz <small>negative</small></span>' : '') + '</div>';
}
function hintText(q){
  const it = q.it;
  return 'Stem: <b>' + esc(it.v.stem) + '-</b>. Tense marker: <b>' + TENSES[it.tense].mark + '</b>' + (it.neg ? '. The negative -ma/-me goes in first.' : '.') + ' Then the person ending for <b>' + PERSONS[it.p] + '</b>.';
}
function renderQ(){
  const q = Q.qs[Q.i], st = Q.state;
  const pct = (Q.i + (st ? 1 : 0)) / Q.qs.length * 100;
  let ask = "", card = "", body = "";

  if (q.kind === "type" || q.kind === "pick") {
    ask = q.kind === "type" ? "Conjugate the verb" : "Pick the right form";
    card = '<p class="vb">' + q.it.v.inf + '</p><div class="en">' + q.it.v.en + '</div>' + tagsHTML(q.it);
  } else if (q.kind === "sent") {
    ask = "Fill the gap with the right form";
    card = '<p class="sent">' + esc(q.before) + '<span class="gap">' + (st ? '<span class="pt-t">' + esc(q.ans) + '</span>' : "&nbsp;&nbsp;&nbsp;") + '</span>' + q.after + '</p>' +
      '<div class="en" style="margin-top:8px"><b>' + q.it.v.inf + '</b>, ' + q.it.v.en + (q.it.neg ? ' (negative)' : '') + '</div>';
  } else if (q.kind === "detect") {
    ask = "Who is doing it, and when?";
    card = '<p class="formbig">' + esc(q.ans) + '</p><div class="en">from <b>' + q.it.v.inf + '</b>, ' + q.it.v.en + '</div>';
  } else {
    const d = q.item;
    ask = q.dir === "tr2en" ? "What does this mean?" : (q.typed ? "Type this in Turkish" : "How do you say this in Turkish?");
    card = '<p class="vb">' + esc(q.dir === "tr2en" ? d.tr : d.en) + '</p>';
  }

  /* answer area */
  if (q.kind === "type" || q.kind === "sent" || (q.kind === "vocab" && q.typed)) {
    const isV2 = q.kind === "vocab";
    body = (q.kind !== "vocab" ? '<div class="hintrow"><span></span>' + (q.hint || st ? "" : '<button class="link" id="hintb">Hint (half XP)</button>') + '</div>' +
        (q.hint && !st ? '<div class="hint">' + (q.kind === "sent" ? 'Time word: <b>' + q.cue[0] + '</b>, ' + q.cue[1] + '. Tense: <b>' + TENSES[q.it.tense].tr + '</b> (' + TENSES[q.it.tense].en + '). Person: <b>' + PERSONS[q.it.p] + '</b>. ' : '') + hintText(q) + '</div>' : "") : "") +
      '<div class="field"><input id="ans" lang="tr" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer"' + (st ? ' value="' + esc(st.typed || "") + '" disabled' : "") + '>' +
      (st ? "" : '<button class="btn" id="check">Check</button>') + '</div>' +
      '<div class="warn" id="warn"></div>' +
      (st ? "" : '<div class="keys">' + ["ç","ğ","ı","ö","ş","ü","İ"].map(c => '<button type="button" data-c="' + c + '" aria-label="Insert ' + c + '">' + c + '</button>').join("") + '</div>');
  } else if (q.kind === "pick" || q.kind === "vocab") {
    body = '<div class="opts">' + q.options.map((o, idx) => {
      let cls = "opt";
      if (st) { if (o === q.ans) cls += " right"; else if (idx === st.chosen) cls += " wrong"; }
      return '<button class="' + cls + '" data-i="' + idx + '"' + (st ? " disabled" : "") + '>' + esc(o) + '</button>';
    }).join("") + '</div>';
  } else if (q.kind === "detect") {
    const sel = Q.sel || { p: null, t: null, n: false };
    body = '<div class="two"><div><div class="lab" style="margin-top:0">Person</div><div class="chips" id="dp">' +
      PERSONS.map((x, i) => '<button class="chip' + (sel.p === i ? " on" : "") + '" data-i="' + i + '"' + (st ? " disabled" : "") + '>' + x + '</button>').join("") + '</div></div>' +
      '<div><div class="lab" style="margin-top:0">Tense</div><div class="chips" id="dt">' +
      S.tenses.map(t => '<button class="chip' + (sel.t === t ? " on" : "") + '" data-t="' + t + '"' + (st ? " disabled" : "") + '>' + TENSES[t].short + ' <small>' + TENSES[t].en + '</small></button>').join("") + '</div></div>' +
      (S.neg === "mix" ? '<div><div class="chips" id="dn"><button class="chip' + (sel.n ? " on" : "") + '" data-n="1"' + (st ? " disabled" : "") + '>olumsuz (negative)</button></div></div>' : "") +
      (st ? "" : '<button class="btn" id="check"' + (sel.p === null || sel.t === null ? " disabled" : "") + '>Check</button>') + '</div>';
  }

  /* feedback */
  let fb = "";
  if (st) {
    const last = Q.i + 1 >= Q.qs.length;
    let head, main = "", extra = "";
    if (q.kind === "vocab") {
      head = st.ok ? "Aferin! Well done." : "Not quite";
      main = '<p><b>' + esc(q.item.tr) + '</b> means “' + esc(q.item.en) + '”.' + (st.note ? " " + st.note : "") + '</p>';
    } else {
      head = st.ok ? PRAISE[rand(PRAISE.length)] : "Not quite";
      main = '<p class="built">' + partsHTML(q.parts) + '</p>' + LEGEND +
        '<p style="font-size:15px">' + PERSONS[q.it.p] + ' · ' + TENSES[q.it.tense].tr + ' (' + TENSES[q.it.tense].en + ')' + (q.it.neg ? ' · negative' : '') + '</p>' +
        (st.note ? '<p>' + st.note + '</p>' : "") +
        (q.notes.length ? '<ul>' + q.notes.map(n => '<li>' + esc(n) + '</li>').join("") + '</ul>' : "");
      if (q.kind === "sent") extra = '<p style="font-size:15px">' + esc(q.cue[0]) + ' = ' + esc(q.cue[1]) + '</p>';
    }
    fb = '<div class="fb ' + (st.ok ? "ok" : "no") + '" role="status"><p class="h1">' + head + '</p>' + main + extra +
      '<button class="btn" id="next">' + (last ? "See results" : "Continue") + '</button></div>';
  }

  app.innerHTML =
    '<div class="top"><button class="x" id="quit" aria-label="Leave this round">×</button>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="pill"><b>' + Q.xp + '</b> XP' + (Q.streak >= 2 ? '<br>' + Q.streak + ' in a row' : '') + '</div></div>' +
    '<p class="ask">' + ask + '</p><div class="card">' + card + '</div>' + body + fb;

  document.getElementById("quit").onclick = home;
  if (st) { const nx = document.getElementById("next"); nx.onclick = advance; nx.focus(); return; }

  const hb = document.getElementById("hintb"); if (hb) hb.onclick = () => { q.hint = true; renderQ(); };
  const input = document.getElementById("ans");
  if (input) {
    const go = () => { if (input.value.trim()) checkTyped(input.value); };
    document.getElementById("check").onclick = go;
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    app.querySelectorAll(".keys button").forEach(b => {
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("click", () => {
        const s = input.selectionStart == null ? input.value.length : input.selectionStart;
        const e2 = input.selectionEnd == null ? s : input.selectionEnd;
        input.value = input.value.slice(0, s) + b.dataset.c + input.value.slice(e2);
        input.focus(); input.setSelectionRange(s + 1, s + 1);
      });
    });
    input.focus();
  }
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const idx = +b.dataset.i; finish(q.options[idx] === q.ans, { chosen: idx });
  });
  if (q.kind === "detect") {
    Q.sel = Q.sel || { p: null, t: null, n: false };
    app.querySelectorAll("#dp .chip").forEach(b => b.onclick = () => { Q.sel.p = +b.dataset.i; renderQ(); });
    app.querySelectorAll("#dt .chip").forEach(b => b.onclick = () => { Q.sel.t = b.dataset.t; renderQ(); });
    app.querySelectorAll("#dn .chip").forEach(b => b.onclick = () => { Q.sel.n = !Q.sel.n; renderQ(); });
    const ck = document.getElementById("check");
    if (ck) ck.onclick = () => {
      const s = Q.sel; Q.sel = null;
      finish(s.p === q.it.p && s.t === q.it.tense && !!s.n === !!q.it.neg, {});
    };
  }
}
const PRAISE = ["Aferin! Well done.", "Harika! Brilliant.", "Süper! Super.", "Bravo!", "Çok güzel! Very nice."];

function checkTyped(val){
  const q = Q.qs[Q.i];
  const a = trl(val.trim()), b = trl(q.ans);
  if (a === b) return finish(true, { typed: val });
  if (fold(a) === fold(b)) {
    if (q.kind === "vocab") return finish(true, { typed: val, note: "Mind the spelling: " + q.ans + "." });
    if (!q.tries) {
      q.tries = 1;
      const w = document.getElementById("warn");
      if (w) w.textContent = "So close. Check ı/i, o/ö, u/ü and the other special letters.";
      return;
    }
  }
  finish(false, { typed: val });
}
function finish(ok, extra){
  const q = Q.qs[Q.i];
  Q.state = Object.assign({ ok }, extra);
  if (!q.counted) { q.counted = true; save.stats.total++; if (ok) save.stats.right++; }
  if (ok) {
    Q.right++; if (!q.wasMissed) Q.first++;
    Q.streak++; Q.best = Math.max(Q.best, Q.streak);
    let gain = 10 + 2 * Math.min(Q.streak, 5);
    if (q.hint) gain = Math.ceil(gain / 2);
    if (q.wasMissed) gain = 4;
    Q.xp += gain;
  } else {
    Q.streak = 0;
    if (!q.wasMissed && Q.requeued < 6) {
      const nq = rebuild(q); nq.wasMissed = true; nq.counted = true; Q.qs.push(nq); Q.requeued++;
    }
    Q.missed.push(q);
  }
  if (q.kind === "vocab") { const k = q.item.tr; save.vk[k] = ok ? Math.min(5, (save.vk[k] || 0) + 1) : Math.max(0, (save.vk[k] || 0) - 2); }
  else if (!q.wasMissed || ok) bumpBox(q.it.v, q.it.tense, ok);
  renderQ();
}
function advance(){
  if (Q.i + 1 >= Q.qs.length) return results();
  Q.i++; Q.state = null; Q.sel = null; renderQ();
}

/* =====================================================================
   Results
   ===================================================================== */
function results(){
  const before = rankInfo(save.xp).i;
  const bonus = 15;
  const gain = Q.xp + bonus;
  save.xp += gain;
  save.stats.rounds++;
  save.stats.bestStreak = Math.max(save.stats.bestStreak, Q.best);
  persist();
  const after = rankInfo(save.xp);
  const n = Q.qs.length - Q.requeued;
  const acc = Math.round(Q.first / n * 100);
  const head = acc >= 90 ? ["Aferin Louise!", "Well done."] : acc >= 70 ? ["Çok iyi!", "Very good."] : acc >= 50 ? ["İyi gidiyor.", "Going well."] : ["Devam et.", "Keep going."];
  let review = "";
  const seen = new Set();
  const miss = Q.missed.filter(q => { const k = q.mode === "vocab" ? q.item.tr : q.ans; if (seen.has(k)) return false; seen.add(k); return true; });
  if (miss.length) {
    review = '<div class="rev"><h2>To review</h2>' + miss.map(q => {
      if (q.mode === "vocab") return '<div class="row"><b>' + esc(q.item.tr) + '</b><small>' + esc(q.item.en) + '</small></div>';
      return '<div class="row"><b>' + partsHTML(q.parts) + '</b><small>' + q.it.v.inf + ' (' + q.it.v.en + ') · ' + PERSONS[q.it.p] + ' · ' + TENSES[q.it.tense].short + (q.it.neg ? ' · negative' : '') + '</small></div>';
    }).join("") + LEGEND + '</div>';
  }
  app.innerHTML =
    '<div class="res"><div class="big">' + acc + '%</div><h1 style="font-size:34px">' + head[0] + '</h1>' +
    '<p class="lede" style="margin:0 auto 6px">' + head[1] + ' ' + Q.first + ' of ' + n + ' right first time. Best streak ' + Q.best + '.</p>' +
    '<p class="lede" style="margin:0 auto 6px"><b>+' + gain + ' XP</b> (including ' + bonus + ' for finishing)' + (after.i > before ? '. <b>New rank: ' + after.cur.n + ' (' + after.cur.t + ')!</b>' : '') + '</p></div>' +
    review +
    '<button class="btn" id="again">Play again</button><button class="btn ghost" id="menu">Menu</button>';
  const mode = Q.mode;
  document.getElementById("again").onclick = () => startRound(mode);
  document.getElementById("menu").onclick = home;
}

/* =====================================================================
   Verb tables
   ===================================================================== */
function tables(inf, neg){
  const sorted = VERBS.slice().sort((a, b) => a.inf.localeCompare(b.inf, "tr"));
  const v = sorted.find(x => x.inf === inf) || sorted.find(x => x.inf === "gelmek");
  const cards = TENSE_KEYS.map(t => {
    const rows = PERSONS.map((p, i) => '<div class="r"><span>' + p + '</span><span>' + partsHTML(conj(v, t, i, neg).parts) + '</span></div>').join("");
    return '<div class="tc"><h3>' + TENSES[t].tr + '</h3><div class="tn">' + TENSES[t].en + ' · ' + TENSES[t].mark + '</div>' + rows + '</div>';
  }).join("");
  const notes = Array.from(new Set([].concat.apply([], TENSE_KEYS.map(t => conj(v, t, 0, neg).notes)).concat(conj(v, "aor", 2, neg).notes)));
  app.innerHTML =
    '<div class="top"><button class="x" id="back" aria-label="Back">←</button><h2 style="margin:0">Verb tables</h2></div>' +
    '<select class="sel" id="vsel" aria-label="Choose a verb">' + sorted.map(x => '<option value="' + x.inf + '"' + (x.inf === v.inf ? " selected" : "") + '>' + x.inf + ', ' + x.en + '</option>').join("") + '</select>' +
    '<div class="seg"><button data-n="0" class="' + (neg ? "" : "on") + '">Positive</button><button data-n="1" class="' + (neg ? "on" : "") + '">Negative</button></div>' +
    '<div style="margin-top:8px">' + LEGEND + '</div>' + cards +
    (notes.length ? '<div class="notice"><b>Things to notice</b><ul>' + notes.map(n => '<li>' + esc(n) + '</li>').join("") + '</ul></div>' : "");
  document.getElementById("back").onclick = home;
  document.getElementById("vsel").onchange = e => tables(e.target.value, neg);
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => tables(v.inf, b.dataset.n === "1"));
}

home();
</script>
